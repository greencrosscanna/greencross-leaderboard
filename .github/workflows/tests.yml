# ─── greencross-leaderboard — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greencross-leaderboard
        uses: actions/checkout@v7
        with:
          # Siblings are checked out BESIDE this repo, so the main checkout needs its own `path:`
          # too — every sibling-reading suite here resolves `__dirname/../../greencross-<name>`.
          path: greencross-leaderboard

      # NO TOKEN, AND NONE SHOULD BE ADDED. greencross-sales is PUBLIC, so actions/checkout reaches
      # it with the default GITHUB_TOKEN. It is the sibling the hub's canonical cross-app contract
      # and palette-drift checks read, so having it here means the ONLY sibling this repo's CI is
      # missing is the private hub — one labeled fact instead of three token-gated steps.
      - name: Check out greencross-sales
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-sales
          path: greencross-sales

      # Also public, also no token, and for the same reason: tests/spiff_sidecar_contract_test.js
      # builds the SPIFF program sidecar with SPIFF'S OWN producer off its shipped source and feeds
      # it to this app's join. Without the sibling it skips, and a contract that only the pusher's
      # machine checks is a contract nobody checks on a Friday. Unlike the hub suites below, this
      # one has no other home — it lives here and nowhere else, so CI is where it has to run.
      - name: Check out greencross-spiff
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-spiff
          path: greencross-spiff

      # ─── WHY greencross-command-center IS NOT CHECKED OUT HERE, AND MUST NOT BE "FIXED" ──────────
      #
      # Four suites in this repo read the hub as a sibling and SKIP without it:
      #   cross_app_contract_test.js      · revenue_rules_contract_test.js
      #   store_palette_drift_test.js     · avatar_write_test.js (its end-to-end half only)
      #
      # greencross-command-center is a PRIVATE repo. A spoke's default GITHUB_TOKEN is scoped to the
      # spoke and cannot reach it. The obvious "fix" is a personal access token — DON'T. It would be a
      # long-lived credential to the repo that publishes the GXCore library, stored in a public repo's
      # secrets, to buy coverage that ALREADY RUNS: the hub's own CI checks out all seven repos and
      # runs those same canonical suites against this repo's real files. The contracts are gated; they
      # are gated on the other side, which is the side that owns them.
      #
      # So those four skipping here is CORRECT, not a gap. They are also still enforced locally by
      # gx-preflight.sh as the pre-push hook, where the whole suite is a sibling checkout on disk.
      # This block previously carried three PAT-gated checkout steps and a job summary instructing the
      # reader to create the PAT — dead scaffolding (the secret was never set) pointing at the wrong
      # answer. Removed 2026-09-13.

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the gate
        working-directory: greencross-leaderboard
        run: sh ./gx-preflight.sh

      # Say what was NOT covered. A green check that quietly skipped a cross-repo suite is exactly the
      # failure this suite spent a week removing.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-leaderboard
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              # ONE MARKER, EVERY REPO: a skip is a line whose first non-space word is SKIP.
              # Column 0 means the whole suite could not run; indented means it ran but had to pass
              # over part of itself — so the COUNT matters, not just the fact.
              #
              # This used to be five different greps across eight repos, each matching the PHRASING
              # its own tests happened to use ("not a sibling", "checkout not present", "live-value
              # check skipped") — five guesses at wording that nothing kept in step, and a suite that
              # reworded its skip would silently go back to being reported as having run. Two suites
              # (crew's drift check, spiff's live-value check) were already in that state and were
              # given the marker in the same pass.
              #
              # Case-sensitive on purpose: assertion labels are lowercase prose ("a nameless row is
              # skipped") and a -i match would flag those until nobody read the warning.
              SKIPRE='^SKIP|^ +SKIP '
              n="$(printf '%s' "$out" | grep -cE "$SKIPRE" || true)"
              if [ "${n:-0}" -gt 0 ]; then
                echo "- ⚠️ \`$t\` — **$n SKIPPED**: $(printf '%s' "$out" | grep -E "$SKIPRE" | head -1 | sed 's/^ *//')"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
            echo ""
            # greencross-sales is public and checked out unconditionally, so its absence means a
            # checkout step FAILED — say so rather than reporting it as an expected skip.
            for sib in greencross-sales greencross-spiff; do
              if [ -d "../$sib" ]; then
                echo "$sib present (public, no token)."
              else
                echo "> **$sib is absent.** It is public and needs no token, so a checkout"
                echo "> step failed — this is not an expected skip."
              fi
            done
            echo ""
            echo "> **greencross-command-center is deliberately NOT checked out here.** It is a PRIVATE"
            echo "> repo and a spoke's default GITHUB_TOKEN cannot reach it. The four suites that read"
            echo "> it — cross-app contract, revenue rules, palette drift, and the avatar end-to-end"
            echo "> half — SKIP here **on purpose**. The same canonical suites run against this repo's"
            echo "> real files in the hub's own CI, which checks out all seven repos, and locally in"
            echo "> this repo's pre-push hook. **Do not add a PAT to \"close\" this gap** — that would"
            echo "> put a long-lived credential for the GXCore library repo into a public repo's"
            echo "> secrets to duplicate coverage that already exists."
          } >> "$GITHUB_STEP_SUMMARY"
